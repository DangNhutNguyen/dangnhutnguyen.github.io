<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sixteen bilingual logbooks on learning, building, fairness, and artificial intelligence by Nguyễn Huỳnh Đăng Nhựt.">
  <meta property="og:title" content="Sixteen Logbooks - Nguyễn Huỳnh Đăng Nhựt">
  <meta property="og:description" content="A bilingual archive of sixteen logbooks, from 2019 to 2026.">
  <meta property="og:image" content="assets/og.png">
  <title>Sixteen Logbooks - Nguyễn Huỳnh Đăng Nhựt</title>
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');try{document.documentElement.dataset.theme=localStorage.getItem('portfolio-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="vendor/marked.umd.js"></script>
  <script defer src="config/generated/writing-content.js"></script>
  <script defer src="config/portfolio.config.js"></script>
  <script defer src="js/site.js"></script>
  <script defer src="js/writings.js"></script>
</head>
<body data-page="writing">
  <div class="site-shell">
    <div data-site-header></div>
    <main class="page-content" id="main-content">
      <div class="container" data-page-content>
        <header class="page-intro">
          <p class="overline">Writing</p>
          <h1>Field notes.</h1>
          <p>Research logs, learning notes, and project retrospectives. Written slowly, revised carefully.</p>
        </header>

        <!-- 1. RESEARCH INTERESTS (Rendered dynamically if content exists) -->
        <section class="section writing-interests-section" data-writing-interests style="display:none;"></section>

        <!-- 2. PROJECTS & EXPLORATIONS (Rendered dynamically if content exists) -->
        <section class="section writing-explorations-section" data-writing-explorations style="display:none;"></section>

        <!-- 3. MEMORIES & MILESTONES (Rendered dynamically if content exists) -->
        <section class="section writing-memories-section" data-writing-memories style="display:none;"></section>

        <!-- 4. SHARED FIELD NOTES ARCHIVE -->
        <section class="section writings-archive-section" data-writings-archive>
          <div class="writings-archive-header">
            <div class="heading-row">
              <div>
                <p class="overline" data-writings-overline>Archive</p>
                <h2 data-writings-heading>Shared Field Notes &amp; Logbooks</h2>
              </div>
              <div class="writing-header-controls">
                <span class="writing-count-badge" data-writing-count>Loading notes</span>
                <div class="writing-language-control" data-writing-language-control></div>
              </div>
            </div>
          </div>

          <div class="writing-filter-toolbar" data-writing-filter-bar></div>

          <div class="writing-index" data-writing-list>
            <noscript><p class="writing-notice">Enable JavaScript to load the writing archive.</p></noscript>
          </div>
        </section>

        <section class="section reach">
          <h2>Questions make good essays.</h2>
          <p class="prose">If a note connects with your work, I would be glad to hear from you.</p>
          <div class="inline-links"><a href="mailto:penciltalk0910@gmail.com">Start a conversation <span class="arrow" aria-hidden="true">↗</span></a></div>
        </section>

        <div data-site-footer></div>
      </div>
    </main>
  </div>
</body>
</html>
