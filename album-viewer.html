<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Archival notebook and visual album viewer by Nguyễn Huỳnh Đăng Nhựt.">
  <title>Album & Notebook Viewer - Nguyễn Huỳnh Đăng Nhựt</title>
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');try{document.documentElement.dataset.theme=localStorage.getItem('portfolio-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="vendor/marked.umd.js"></script>
  <script defer src="config/generated/writing-content.js"></script>
  <script defer src="config/portfolio.config.js"></script>
  <script defer src="js/site.js"></script>
  <script defer src="js/writings.js"></script>
</head>
<body data-page="album-viewer">
  <div class="site-shell">
    <div data-site-header></div>
    <main class="page-content" id="main-content">
      <div class="container album-viewer-container" data-page-content>
        <div class="album-standalone-wrap" data-standalone-album-mount>
          <div class="writing-notice">Loading notebook album…</div>
        </div>
        <div data-site-footer></div>
      </div>
    </main>
  </div>
</body>
</html>
